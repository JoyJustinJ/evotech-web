<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" width="220" height="52" fill="none">
  <defs>
    <!-- Background Gradient for Badge -->
    <linearGradient id="logoBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>

    <!-- Neon Cyan to Cobalt Gradient -->
    <linearGradient id="logoEvoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Soft Glass Gradient Fill -->
    <linearGradient id="logoGlassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="logoNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00f2fe" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Emblem Badge (44x44) -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#logoBadgeBg)" stroke="url(#logoEvoCyan)" stroke-width="1.6"/>
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#logoEvoCyan)" opacity="0.1"/>

    <g filter="url(#logoNeonGlow)">
      <!-- Main "E" Forward Arrow Block -->
      <path fill-rule="evenodd" clip-rule="evenodd"
            d="M6 7H22L29.5 22L22 37H6V7ZM11 12H19.5L23 19H11V12ZM11 25H23L19.5 32H11V25Z"
            fill="url(#logoGlassFill)"
            stroke="url(#logoEvoCyan)"
            stroke-width="1.8"
            stroke-linejoin="round"/>

      <!-- Parallel Chevron Wing -->
      <path d="M26.5 7H30.5L38 22L30.5 37H26.5L34 22L26.5 7Z"
            fill="url(#logoGlassFill)"
            stroke="url(#logoEvoCyan)"
            stroke-width="1.8"
            stroke-linejoin="round"/>

      <!-- Highlights -->
      <circle cx="6" cy="7" r="1.3" fill="#ffffff"/>
      <circle cx="29.5" cy="22" r="1.4" fill="#00f2fe"/>
      <circle cx="38" cy="22" r="1.4" fill="#ffffff"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <!-- "EVO" -->
  <text x="60" y="32" font-family="'Plus Jakarta Sans', 'Kumbh Sans', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1.2">EVO</text>
  
  <!-- "TECH" with electric gradient -->
  <text x="114" y="32" font-family="'Plus Jakarta Sans', 'Kumbh Sans', sans-serif" font-size="24" font-weight="900" fill="url(#logoEvoCyan)" letter-spacing="1.2">TECH</text>
  
  <!-- Subtitle -->
  <text x="61" y="44" font-family="'Kumbh Sans', sans-serif" font-size="8" font-weight="700" fill="#64748b" letter-spacing="3">ENGINEERING THE FUTURE</text>
</svg>
